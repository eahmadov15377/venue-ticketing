<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Aurora Theatre — Tickets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <div>
        <h1 class="brand-title">Grand Aurora Theatre</h1>
        <p class="brand-subtitle">Choose your seats</p>
      </div>
    </div>
  </header>

  <main class="app">
    <section class="panel venue-panel" aria-labelledby="venueHeading">
      <div class="panel-header">
        <h2 id="venueHeading" class="panel-title">Venue map</h2>
      </div>

      <div class="viewport" id="viewport">
        <div class="venue-canvas" id="venueCanvas">
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <section class="panel details-panel" aria-labelledby="detailsHeading">
        <div class="panel-header">
          <h2 id="detailsHeading" class="panel-title">Seat details</h2>
        </div>
        <div class="details-body" id="seatDetails" aria-live="polite">
          <p class="placeholder">Select a seat on the map to see its details and price.</p>
        </div>
      </section>

      <section class="panel cart-panel" aria-labelledby="cartHeading">
        <div class="panel-header">
          <h2 id="cartHeading" class="panel-title">Your tickets</h2>
          <span class="badge" id="cartCount">0</span>
        </div>
        <ul class="cart-list" id="cartList"></ul>
        <p class="placeholder" id="cartEmpty">No tickets in your cart yet.</p>
        <div class="cart-total">
          <span>Total</span>
          <strong id="cartTotal">0 AZN</strong>
        </div>
      </section>
    </aside>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
